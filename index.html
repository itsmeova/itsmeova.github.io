<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Budgeting Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- Container Utama -->
    <div class="container mx-auto max-w-4xl p-4 sm:p-6">
        
        <!-- Judul Aplikasi -->
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">💰 Budget Tracker</h1>
            <p class="text-gray-600 text-sm mt-1">Kelola keuangan harian Anda dengan mudah dan praktis</p>
        </header>

        <!-- Kartu Ringkasan (Balance, Income, Expense) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-blue-500">
                <h2 class="text-gray-500 text-sm font-semibold uppercase">Total Saldo</h2>
                <p id="balance" class="text-2xl font-bold text-gray-800 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-green-500">
                <h2 class="text-gray-500 text-sm font-semibold uppercase">Pemasukan</h2>
                <p id="total-income" class="text-2xl font-bold text-green-600 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-md border-l-4 border-red-500">
                <h2 class="text-gray-500 text-sm font-semibold uppercase">Pengeluaran</h2>
                <p id="total-expense" class="text-2xl font-bold text-red-600 mt-1">Rp 0</p>
            </div>
        </div>

        <!-- Grid Bagian Form dan Grafik -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            
            <!-- Form Tambah Transaksi -->
            <div class="bg-white p-6 rounded-xl shadow-md">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Tambah Transaksi Baru</h3>
                <form id="transaction-form" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-1" for="description">Keterangan</label>
                        <input type="text" id="description" placeholder="Contoh: Gaji, Belanja Bulanan..." required
                            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-1" for="amount">Jumlah (Rp)</label>
                        <input type="number" id="amount" placeholder="Contoh: 50000" required
                            class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-gray-700 text-sm font-semibold mb-1" for="type">Tipe Transaksi</label>
                        <select id="type" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                            <option value="income">Pemasukan (Income)</option>
                            <option value="expense">Pengeluaran (Expense)</option>
                        </select>
                    </div>
                    <button type="submit" 
                        class="w-full bg-blue-600 text-white font-semibold py-2 rounded-lg hover:bg-blue-700 transition duration-200 text-sm">
                        Tambah Transaksi
                    </button>
                </form>
            </div>

            <!-- Grafik Visual -->
            <div class="bg-white p-6 rounded-xl shadow-md flex flex-col items-center justify-center">
                <h3 class="text-lg font-bold text-gray-800 mb-2 self-start">Statistik Keuangan</h3>
                <div class="w-full h-64 flex justify-center items-center">
                    <canvas id="expenseChart"></canvas>
                </div>
            </div>

        </div>

        <!-- Riwayat Transaksi -->
        <div class="bg-white p-6 rounded-xl shadow-md">
            <h3 class="text-lg font-bold text-gray-800 mb-4">Riwayat Transaksi</h3>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b text-gray-600 text-sm">
                            <th class="py-2 px-3">Keterangan</th>
                            <th class="py-2 px-3">Jumlah</th>
                            <th class="py-2 px-3">Tipe</th>
                            <th class="py-2 px-3 text-center">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="transaction-list" class="text-sm text-gray-700">
                        <!-- Data transaksi akan dimasukkan lewat JavaScript -->
                    </tbody>
                </table>
            </div>
            <p id="no-transaction" class="text-center text-gray-500 text-sm py-4 hidden">Belum ada transaksi yang dicatat.</p>
        </div>

    </div>

    <!-- Script JavaScript -->
    <script>
        // Ambil data dari localStorage atau buat array kosong
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

        const balanceEl = document.getElementById('balance');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const transactionListEl = document.getElementById('transaction-list');
        const noTransactionEl = document.getElementById('no-transaction');
        const formEl = document.getElementById('transaction-form');
        
        let myChart = null;

        // Fungsi format mata uang Rupiah
        function formatRupiah(number) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(number);
        }

        // Fungsi Update UI & LocalStorage
        function updateUI() {
            transactionListEl.innerHTML = '';
            let totalIncome = 0;
            let totalExpense = 0;

            if (transactions.length === 0) {
                noTransactionEl.classList.remove('hidden');
            } else {
                noTransactionEl.classList.add('hidden');
                transactions.forEach((trx, index) => {
                    if (trx.type === 'income') {
                        totalIncome += Number(trx.amount);
                    } else {
                        totalExpense += Number(trx.amount);
                    }

                    const tr = document.createElement('tr');
                    tr.className = 'border-b hover:bg-gray-50';
                    tr.innerHTML = `
                        <td class="py-3 px-3">${trx.description}</td>
                        <td class="py-3 px-3 font-semibold ${trx.type === 'income' ? 'text-green-600' : 'text-red-600'}">
                            ${trx.type === 'income' ? '+' : '-'} ${formatRupiah(trx.amount)}
                        </td>
                        <td class="py-3 px-3">
                            <span class="px-2 py-1 text-xs rounded-full ${trx.type === 'income' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">
                                ${trx.type === 'income' ? 'Pemasukan' : 'Pengeluaran'}
                            </span>
                        </td>
                        <td class="py-3 px-3 text-center">
                            <button onclick="deleteTransaction(${index})" class="text-red-500 hover:text-red-700 text-xs font-semibold bg-red-50 px-2 py-1 rounded">Hapus</button>
                        </td>
                    `;
                    transactionListEl.appendChild(tr);
                });
            }

            const balance = totalIncome - totalExpense;

            balanceEl.innerText = formatRupiah(balance);
            totalIncomeEl.innerText = formatRupiah(totalIncome);
            totalExpenseEl.innerText = formatRupiah(totalExpense);

            localStorage.setItem('transactions', JSON.stringify(transactions));
            updateChart(totalIncome, totalExpense);
        }

        // Tambah Transaksi Baru
        formEl.addEventListener('submit', function(e) {
            e.preventDefault();
            const description = document.getElementById('description').value;
            const amount = document.getElementById('amount').value;
            const type = document.getElementById('type').value;

            const newTransaction = {
                description,
                amount: parseFloat(amount),
                type
            };

            transactions.push(newTransaction);
            formEl.reset();
            updateUI();
        });

        // Hapus Transaksi
        function deleteTransaction(index) {
            transactions.splice(index, 1);
            updateUI();
        }

        // Inisialisasi & Update Grafik Chart.js
        function updateChart(income, expense) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            
            if (myChart) {
                myChart.destroy();
            }

            myChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Pemasukan', 'Pengeluaran'],
                    datasets: [{
                        data: [income, expense],
                        backgroundColor: ['#22c55e', '#ef4444'],
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        }

        // Jalankan saat pertama kali dimuat
        updateUI();
    </script>
</body>
</html>
